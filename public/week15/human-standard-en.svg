<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Optional evidence. Equal consideration.</title><desc id="desc">English-language candidate-rights infographic. Employer enforcement and oversight have not been verified.</desc><rect width="1080" height="1350" fill="#F3F1EB"/><rect width="1080" height="340" fill="#132A47"/><rect x="68" y="62" width="13" height="45" rx="6" fill="#4EC2B4"/><text x="108" y="99" fill="white" font-size="30" font-family="Arial,sans-serif" font-weight="700">PROOF-OF-SKILL</text><text x="68" y="171" fill="#80DDD2" font-size="24" letter-spacing="3" font-family="Arial,sans-serif">THE HUMAN STANDARD</text><text x="68" y="245" fill="white" font-size="56" font-family="Arial,sans-serif" font-weight="700">Optional evidence.</text><text x="68" y="309" fill="white" font-size="53" font-family="Arial,sans-serif" font-weight="700">Equal consideration.</text><g font-family="Arial,sans-serif"><rect x="58" y="386" width="964" height="158" rx="22" fill="#FFFFFF"/><circle cx="120" cy="448" r="30" fill="#D8F2EE"/><text x="107" y="460" font-size="34" font-weight="700" fill="#237F78">1</text><text x="176" y="445" font-size="34" font-weight="700" fill="#132A47">Joining is voluntary</text><text x="176" y="494" font-size="25" fill="#344B5D">A sample must not become a hidden requirement.</text><rect x="58" y="560" width="964" height="158" rx="22" fill="#FFFFFF"/><circle cx="120" cy="622" r="30" fill="#D8F2EE"/><text x="107" y="634" font-size="34" font-weight="700" fill="#237F78">2</text><text x="176" y="619" font-size="34" font-weight="700" fill="#132A47">An equivalent route</text><text x="176" y="668" font-size="25" fill="#344B5D">Opting out must not eliminate fair consideration.</text><rect x="58" y="734" width="964" height="158" rx="22" fill="#FFFFFF"/><circle cx="120" cy="796" r="30" fill="#D8F2EE"/><text x="107" y="808" font-size="34" font-weight="700" fill="#237F78">3</text><text x="176" y="793" font-size="34" font-weight="700" fill="#132A47">Candidates can correct errors</text><text x="176" y="842" font-size="25" fill="#344B5D">Do not assume authorship or provenance is verified.</text><rect x="58" y="908" width="964" height="158" rx="22" fill="#FFFFFF"/><circle cx="120" cy="970" r="30" fill="#D8F2EE"/><text x="107" y="982" font-size="34" font-weight="700" fill="#237F78">4</text><text x="176" y="967" font-size="34" font-weight="700" fill="#132A47">Humans make decisions</text><text x="176" y="1016" font-size="25" fill="#344B5D">No automatic rejection or candidate fees.</text><rect x="58" y="1090" width="964" height="183" rx="22" fill="#E0F0ED"/><text x="87" y="1142" font-size="29" font-weight="700" fill="#132A47">Important limitation</text><text x="87" y="1186" font-size="23" fill="#344B5D">Equivalent routes and oversight are proposed requirements.</text><text x="87" y="1226" font-size="23" fill="#344B5D">Their real-world enforcement has not been verified.</text><text x="65" y="1323" font-size="19" fill="#526A78">Educational material · No certification or verified hiring outcomes.</text></g></svg>