<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc"><title id="title">A CV cannot tell the full story</title><desc id="desc">Beyond the CV, English educational carousel, slide 1 of 4. Not evidence of real candidate or employer outcomes.</desc><rect width="1080" height="1080" fill="#F3F1EB"/><rect width="1080" height="180" fill="#132A47"/><rect x="72" y="68" width="18" height="50" rx="9" fill="#38A69D"/><text x="115" y="104" font-size="31" font-family="Arial,sans-serif" font-weight="700" fill="#FFFFFF">PROOF-OF-SKILL</text><text x="72" y="246" font-size="26" font-family="Arial,sans-serif" letter-spacing="4" font-weight="700" fill="#237F78">BEYOND THE CV</text><rect x="72" y="307" rx="32" width="936" height="590" fill="#FFFFFF"/><circle cx="870" cy="390" r="80" fill="#38A69D"/><text x="846" y="406" font-size="44" font-family="Arial,sans-serif" font-weight="700" fill="#132A47">1</text><text x="120" y="460" font-size="49" font-family="Arial,sans-serif" font-weight="700" fill="#132A47">A CV cannot tell the full story</text><text x="120" y="570" font-size="37" font-family="Arial,sans-serif" fill="#344B5D">A list of tools does not show how</text><text x="120" y="635" font-size="37" font-family="Arial,sans-serif" fill="#344B5D">someone approached a real problem.</text><text x="120" y="700" font-size="37" font-family="Arial,sans-serif" fill="#344B5D">Nor does it prove they cannot.</text><text x="72" y="966" font-size="24" font-family="Arial,sans-serif" fill="#37566A">Do not demand extra tests by default.</text><text x="892" y="970" font-size="27" font-family="Arial,sans-serif" font-weight="700" fill="#237F78">1 / 4</text></svg>