<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc"><title id="title">La evidencia tiene límites</title><desc id="desc">Panel educativo 3 de 4. Serie Beyond the CV. Datos conceptuales, no resultados de investigación.</desc><rect width="1080" height="1080" fill="#F3F1EB"/><rect width="1080" height="180" fill="#132A47"/><rect x="72" y="68" width="18" height="50" rx="9" fill="#38A69D"/><text x="115" y="104" font-size="31" font-family="Arial,sans-serif" font-weight="700" fill="#FFFFFF">PROOF-OF-SKILL</text><text x="72" y="246" font-size="26" font-family="Arial,sans-serif" letter-spacing="4" font-weight="700" fill="#237F78">BEYOND THE CV</text><rect x="72" y="307" rx="32" width="936" height="590" fill="#FFFFFF"/><circle cx="870" cy="390" r="80" fill="#69B4AC"/><text x="846" y="406" font-size="44" font-family="Arial,sans-serif" font-weight="700" fill="#132A47">3</text><text x="120" y="460" font-size="56" font-family="Arial,sans-serif" font-weight="700" fill="#132A47">La evidencia tiene límites</text><text x="120" y="570" font-size="37" font-family="Arial,sans-serif" fill="#344B5D">Ver un archivo no certifica habilidad,</text><text x="120" y="635" font-size="37" font-family="Arial,sans-serif" fill="#344B5D">experiencia, autoría ni desempeño</text><text x="120" y="700" font-size="37" font-family="Arial,sans-serif" fill="#344B5D">futuro de una persona.</text><text x="72" y="966" font-size="24" font-family="Arial,sans-serif" fill="#37566A">Lo desconocido debe quedar visible.</text><text x="892" y="970" font-size="27" font-family="Arial,sans-serif" font-weight="700" fill="#237F78">3 / 4</text></svg>